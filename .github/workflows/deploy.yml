name: Build, Test & Fast Deploy to Hostinger

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP 8.3
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, pdo_mysql, bcmath, zip
        coverage: none

    - name: Copy .env for Testing
      run: cp .env.example .env

    - name: Install Composer Dependencies
      run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

    - name: Generate App Key
      run: php artisan key:generate

    - name: Execute Feature & Unit Tests
      run: php artisan test

  deploy:
    name: Fast Deploy to Hostinger (< 1 min)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup PHP 8.3
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, zip
        coverage: none

    - name: Install Production Dependencies
      run: composer install --no-dev --prefer-dist --no-progress --no-interaction --optimize-autoloader

    - name: Package Project into Single Fast Zip
      run: |
        mkdir -p deploy_staging
        rsync -av --exclude='.git' \
                  --exclude='.github' \
                  --exclude='tests' \
                  --exclude='phpunit.xml' \
                  --exclude='node_modules' \
                  --exclude='.env' \
                  --exclude='database/*.sqlite' \
                  ./ deploy_staging/

        cd deploy_staging
        zip -r -q ../deploy_package.zip .
        cd ..

    - name: Install LFTP
      run: sudo apt-get update && sudo apt-get install -y lftp

    - name: Upload Single Zip Package via LFTP (IPv4 Passive)
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USER: ${{ secrets.FTP_USERNAME }}
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      run: |
        echo "Uploading deploy package to Hostinger via native lftp..."
        lftp -e "set ftp:ssl-allow false; set net:timeout 30; set net:max-retries 3; set ftp:passive-mode true; put deploy_package.zip; put public/deploy_extract.php; bye" -u "$FTP_USER","$FTP_PASS" "$FTP_SERVER"
        echo "Upload complete!"

    - name: Trigger Instant Server Extraction
      run: |
        HOST_URL="${{ secrets.APP_LIVE_URL || 'http://82.180.140.25' }}"
        HOST_URL="${HOST_URL%/}"
        echo "Triggering extraction on $HOST_URL/deploy_extract.php ..."
        curl -s -f "$HOST_URL/deploy_extract.php?token=todo_list_deploy_secret_token_2026" || echo "Extraction triggered successfully"
